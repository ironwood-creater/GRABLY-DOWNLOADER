# Grabbly on Vercel: the website (public/, served by Vercel's CDN) and the download API
# (server/app.py, a FastAPI app that runs as a Vercel Function).
[project]
name = "grabbly"
version = "1.0.0"
requires-python = ">=3.12"
# Same as server/requirements.txt (server/tests/test_deploy.py checks that they match)
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "yt-dlp[default,curl-cffi]>=2026.10.26",
    "imageio-ffmpeg==0.7.0",
]

[tool.vercel]
entrypoint = "server.app:app"

[tool.vercel.scripts]
# Adds cache-busting links and the AdSense IDs to the pages in public/ (see server/site.py)
build = "python -m server.site"
