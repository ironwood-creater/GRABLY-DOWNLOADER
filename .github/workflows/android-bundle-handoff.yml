# One-off: builds the Google Play bundle (version 1.2.0, code 21, unsigned) and commits it to this
# branch so it can be signed with the upload key outside GitHub. Removed again after use.
name: Bundle handoff

on:
  push:
    branches: [claude/blissful-knuth-6pfc4b]
    paths: [".github/workflows/android-bundle-handoff.yml"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the bundle
        run: ./gradlew bundleRelease -Pgrably.versionCode=21 -Pgrably.versionName=1.2.0

      - name: Commit the bundle
        run: |
          mkdir -p release
          cp app/build/outputs/bundle/release/app-release.aab release/app-release-unsigned.aab
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/app-release-unsigned.aab
          git commit -m "Unsigned Google Play bundle (version 1.2.0) for signing"
          for wait in 2 4 8 16; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$wait"
          done
          exit 1
