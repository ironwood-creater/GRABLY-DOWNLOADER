# Builds the Grably Android app and runs its tests.
# The installable APK is attached to each run under "Artifacts" (grably-debug-apk).
name: Android app

on:
  push:
    branches: [main, claude/blissful-knuth-6pfc4b]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Grably server address, e.g. https://grably-downloader.example.workers.dev"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      # The server the app talks to: the run's input, else the GRABLY_API_URL repository variable
      API_BASE_URL: ${{ inputs.api_base_url || vars.GRABLY_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -Pgrably.apiBaseUrl="$API_BASE_URL"

      - name: Build the APK
        run: ./gradlew assembleDebug -Pgrably.apiBaseUrl="$API_BASE_URL"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: grably-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
