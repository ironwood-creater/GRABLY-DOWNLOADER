# Builds the Grably Android app and runs its tests.
# The installable APK is attached to each run under "Artifacts" (grably-debug-apk).
# A second job runs the app on an Android emulator against a stand-in server (android/ci/fake_server.py).
name: Android app

on:
  push:
    branches: [main, claude/blissful-knuth-6pfc4b]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Grably server address, e.g. https://grably-downloader.example.workers.dev"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      # The server the app talks to: the run's input, else the GRABLY_API_URL repository variable
      API_BASE_URL: ${{ inputs.api_base_url || vars.GRABLY_API_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest -Pgrably.apiBaseUrl="$API_BASE_URL"

      - name: Build the APK
        run: ./gradlew assembleDebug -Pgrably.apiBaseUrl="$API_BASE_URL"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: grably-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      # The emulator reaches the runner's stand-in server at 10.0.2.2
      FAKE_SERVER: http://10.0.2.2:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Start the stand-in server
        run: nohup python3 ci/fake_server.py > "$RUNNER_TEMP/fake-server.log" 2>&1 &

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its device tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pgrably.apiBaseUrl="$FAKE_SERVER"

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest -Pgrably.apiBaseUrl="$FAKE_SERVER" || (adb logcat -d -t 400 '*:E' ; exit 1)

      - name: Stand-in server log
        if: always()
        run: cat "$RUNNER_TEMP/fake-server.log" || true

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
