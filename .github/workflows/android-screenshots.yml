# Takes the Google Play screenshots from the real app on an emulator (1080 x 1920) and commits
# them to android/store/screenshots/raw. Runs when this file or ScreenshotTest.kt changes;
# after other changes to the app's look, run it from the Actions tab.
name: Store screenshots

on:
  push:
    branches: [claude/blissful-knuth-6pfc4b]
    paths:
      - ".github/workflows/android-screenshots.yml"
      - "android/app/src/androidTest/java/com/grabbly/downloader/ScreenshotTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      FAKE_SERVER: http://10.0.2.2:8000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Start the stand-in server
        run: nohup python3 ci/fake_server.py > "$RUNNER_TEMP/fake-server.log" 2>&1 &

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its device tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pgrabbly.apiBaseUrl="$FAKE_SERVER"

      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: |
            ./gradlew connectedDebugAndroidTest -Pgrabbly.apiBaseUrl="$FAKE_SERVER" -Pandroid.testInstrumentationRunnerArguments.class=com.grabbly.downloader.ScreenshotTest || (adb logcat -d -t 300 '*:E' ; exit 1)
            mkdir -p store/screenshots/raw
            adb pull /data/local/tmp/grabbly-shots/. store/screenshots/raw/
            ls -la store/screenshots/raw

      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/screenshots/raw
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Google Play screenshots from the emulator"
          # GitHub sometimes rejects a push with a passing server error: try a few times
          for wait in 2 4 8 16; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$wait"
          done
          exit 1

      - name: Stand-in server log
        if: always()
        run: cat "$RUNNER_TEMP/fake-server.log" || true
